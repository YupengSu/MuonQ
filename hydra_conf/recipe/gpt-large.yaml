training_params:
  # tokens_processed must be divisible by (world size * batch size * token length)
  tokens_processed: 4194304 # 2^19
  batch_size: 2
  num_epochs: 1
  context_length: 8192
  gradnorm: 1.0
  tensorcore_precision: high   #Can be highest, high, or medium
  autocast: True
  mixed_precision: bfloat16
  compile: True

model:
  model_type: gpt
  block_size: 8192
  n_embd: 1280    
  n_layer: 36   
  n_head: 20    
  vocab_size: 50257
  flash_attention: True

dataset:
  name: "fineweb10B"
  tokenizer: "gpt2"
  total_tokens_B: 10


