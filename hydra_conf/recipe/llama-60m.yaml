training_params:
  tokens_processed: 524288
  val_tokens_processed: 8388608
  batch_size: 64
  num_epochs: 1
  context_length: 1024
  gradnorm: 1.0
  tensorcore_precision: high
  autocast: True
  mixed_precision: bfloat16
  compile: True

model:
  model_type: llama
  n_embd: 512
  n_layer: 8
  n_head: 8
  vocab_size: 32000
  intermediate_size: 1376
  rope_theta: 10000.0
  flash_attention: True

dataset:
  name: "fineweb100B"
  tokenizer: "Llama-2-7b-hf"
  total_tokens_B: 1.1