training_params:
  tokens_processed: 2097152
  batch_size: 4
  num_epochs: 1
  context_length: 4096
  gradnorm: 1.0
  tensorcore_precision: high
  autocast: True
  mixed_precision: bfloat16
  compile: True

# LLaMA 1B: ~1B params
# hidden_size=2048, n_layer=24, n_head=32, intermediate_size=5461
model:
  model_type: llama
  n_embd: 2048
  n_layer: 24
  n_head: 32
  vocab_size: 32000
  intermediate_size: 5461
  rope_theta: 10000.0
  flash_attention: True

dataset:
  name: "fineweb100B"
  tokenizer: "Llama-2-7b-hf"
  total_tokens_B: 13.1